name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev groff-base
      - name: Build (warnings are errors)
        run: make CFLAGS_EXTRA=-Werror
      - name: Test
        run: make test CFLAGS_EXTRA=-Werror
